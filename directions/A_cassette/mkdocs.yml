# NOTE: 2026-07-16 — Chris picked this direction. The base `mkdocs.yml`
# in the repo root now uses cassette-core.css directly. This overlay
# file is kept as a version with a snappier site_name in case Chris ever
# wants the "NOSTROMO-CLASS" branding version.

INHERIT: ../../mkdocs.yml

docs_dir: ../../docs
site_name: CHRIS CARPENTER // NOSTROMO-CLASS DEV
site_description: Portfolio — engineered for future's past

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: cassette
      primary: custom
      accent: custom
  font:
    text: Share Tech Mono
    code: Space Mono
  icon:
    logo: material/tape-drive
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/cassette-core.css
