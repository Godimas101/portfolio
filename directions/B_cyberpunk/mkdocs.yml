INHERIT: ../../mkdocs.yml

docs_dir: ../../docs
site_name: CHRIS_CARPENTER // NIGHT.CITY
site_description: Portfolio — high-tech dystopia edition

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - toc.follow
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: cyberpunk
      primary: custom
      accent: custom
  font:
    text: Rajdhani
    code: JetBrains Mono
  icon:
    logo: material/chip
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/cyberpunk.css
