site_name: Chris Carpenter
site_description: Portfolio — SE + MW5 mods, The Canadian Space, AI-assisted automation
site_author: Chris Carpenter (Godimas101)
site_url: https://portfolio.godimas.dev

# Chris picked Direction A (Cassette Core) on 2026-07-16. This base config
# now uses that CSS directly. `mkdocs serve` from repo root "just works".
# Directions B (Cyberpunk) + C (Hybrid) are stashed under `stashed/` for
# reference — they can be re-promoted anytime.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
    - content.tabs.link
  palette:
    - scheme: cassette
      primary: custom
      accent: custom
  font:
    text: Share Tech Mono
    code: Space Mono
  icon:
    logo: material/tape-drive
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/cassette-core.css

nav:
  - Home: index.md
  - About: about.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: false
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rustygear/
      name: LinkedIn
    - icon: fontawesome/brands/patreon
      link: https://patreon.com/Godimas101
      name: Patreon
    - icon: fontawesome/brands/discord
      link: https://discord.com/users/235753132594823169
      name: Discord
  generator: false
