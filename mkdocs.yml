site_name: Chris Carpenter
site_description: Portfolio — SE + MW5 mods, The Canadian Space, AI-assisted automation
site_author: Chris Carpenter (Godimas101)
site_url: https://godimas101.github.io/portfolio/

# The look is Phosphor Console (portfolio#7): an amber CRT, built from one
# stylesheet and self-hosted fonts. `zensical serve` from the repo root works.
# The older directions stay under `directions/` and `stashed/` for reference.

# Files that stay in the repo but off the site: the older directions'
# stylesheets and their preview images.
exclude_docs: |
  assets/stylesheets/*.css
  !assets/stylesheets/phosphor.css
  assets/images/direction-previews/

theme:
  name: material
  # Zensical (portfolio#4): the classic variant keeps Material for MkDocs' look.
  variant: classic
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips
    - content.tabs.link
  palette:
    - scheme: phosphor
      primary: custom
      accent: custom
  # Fonts are self-hosted from docs/assets/fonts, so no Google Fonts request.
  font: false
  logo: assets/images/mark.svg
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/stylesheets/phosphor.css

nav:
  - Home: index.md
  - Work: work.md
  - Wins: wins.md
  - Credits: credits.md
  - About: about.md

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rustygear/
      name: LinkedIn
    - icon: fontawesome/brands/patreon
      link: https://patreon.com/Godimas101
      name: Patreon
    - icon: fontawesome/brands/discord
      link: https://discord.com/users/235753132594823169
      name: Discord
  generator: false
