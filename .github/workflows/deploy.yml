name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history brings origin/gh-pages, so each deploy commit builds on the last one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: zensical build --strict

      # What `mkdocs gh-deploy --force` did: commit site/ to gh-pages with a
      # .nojekyll file, then force-push it.
      - name: Deploy to gh-pages
        run: ghp-import --no-jekyll --push --force --message "Deployed ${GITHUB_SHA::7} with Zensical $(zensical --version)" site
